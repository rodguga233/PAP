<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="stylesheet" href="./css/main.css">

    <script src="https://code.iconify.design/iconify-icon/1.0.5/iconify-icon.min.js"></script>
  </head>

  <body style="background-color: #F3F4F6;">
    <div id="notification" class="notification green-background">
      <iconify-icon icon="mdi:check-circle-outline" width="24" height="24"></iconify-icon>
      <p>Tarefa apagada</p>
    </div>

    <div class="profile-wrapper">

      <h1>O meu perfil</h1>

      <!-- FOTO DE PERFIL -->
      <div class="profile-photo-section">
        <div id="photo-preview" class="photo-preview">
          <img id="profile-photo" src="img/perfil.jpg" alt="Foto de perfil">
        </div>
        <button id="change-photo-btn" class="change-photo-btn">Alterar foto</button>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </div>

      <!-- FORMULÁRIO -->
      <div class="profile-form">

        <label>Nome</label>
        <input type="text" id="nome">

        <label>Email</label>
        <input type="email" id="email" readonly>

        <label>Password</label>
        <input type="password" id="password">
        <label style="font-size: 14px; font-weight: bold; color: #ff0505; display: block; margin-top: 0px;" id="password-error"> 
          A password deve ter pelo menos 6 caracteres. 
        </label>

        <label>Confirmar Password</label>
        <input type="password" id="password-confirm">

        <label id="password-match-error" 
          style="font-size: 14px; font-weight: bold; color: #ff0505; display: none; margin-top: 0px;">
          As passwords não coincidem.
        </label>


        <label class="notif-label" 
          style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; 
          margin-top: 10px; font-size: 15px; width: auto; margin-bottom: 0px;"
        >
          <input type="checkbox" id="notificacoes" style="width: 20px; height: 20px; transform: scale(0.9); cursor: pointer;" />
          Receber notificações por email
        </label>

        <button id="save-profile" class="save-btn">Guardar alterações</button>
        <button id="back-btn" class="back-btn">Voltar</button>
        <button id="delete-account-btn" 
                class="back-btn" 
                style="background:#ff4d4d; color:white;">
          Eliminar conta
        </button>
      </div>

    </div>

    <!-- POPUP ELIMINAR CONTA -->
    <div id="popup-eliminar-conta" class="overlay hide">
      <div class="overlay-content" 
     style="max-width:420px; background:#fff; padding:28px; border-radius:12px;">

        <h2 style="margin-bottom:10px; color:#b30000;">Eliminar conta</h2>

        <p style="font-size:16px; margin-bottom:20px;">
          Esta ação é <strong>permanente</strong> e não pode ser revertida.<br>
          Todos os teus dados serão eliminados.
        </p>

        <div style="display:flex; gap:14px; margin-top:24px;">
          <button id="cancelar-eliminar" 
                  class="button regular-button" 
                  style="flex:1; background:#E5E7EB;">
            Cancelar
          </button>

          <button id="confirmar-eliminar" 
                  class="button regular-button red-background" 
                  style="flex:1; background:#ff4d4d;">
            Confirmar
          </button>
        </div>

      </div>
    </div>

    <script type="module" src="./script/perfil.mjs"></script>
  </body>
</html>
