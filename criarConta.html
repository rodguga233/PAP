<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- CSS do template -->
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/entry-page.css" />
  </head>

  <body>
    <div class="row height-full" style="background-color: #F3F4F6;">
      <!-- left side -->
      <div
        class="left-column flex flex-column height-full justify-center items-center"
      >
        <h1 class="welcoming-title">Criar Conta</h1>

        <form id="criarConta" class="form" autocomplete="off">
          <label for="nome" class="label">Nome</label>
          <input type="text" name="nome" id="nome" class="input" required />

          <label for="email" class="label">Email</label>
          <input type="email" name="email" id="email" class="input" required />

          <label for="password1" class="label">Password</label>
          <input
            type="password"
            name="password1"
            id="password1"
            class="input"
            required
          />

          <label for="password2" class="label">Confirmar Password</label>
          <input
            type="password"
            name="password2"
            id="password2"
            class="input"
            required
          />

          <label id="error" style="color:red; font-size: 13px; display:none; margin-top:5px;">
            As passwords não coincidem
          </label>

          <!-- Checkbox mostrar password -->
          <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 10px; font-size: 15px; width: auto;">
            <input type="checkbox" id="checkbox" onclick="mostrar()" style="width: 20px; height: 20px; transform: scale(0.9); cursor: pointer;" />
            <span>Mostrar Password</span>
          </label>

          <button
            type="submit"
            id="criar"
            class="button regular-button pink-background cta-btn"
            style="margin-top: 15px;"
          >
            Criar Conta
          </button>
        </form>

        <p class="login-prompt">
          Já tens conta?
          <a href="./index.html" class="log-in-link">Entrar</a>
        </p>
      </div>

      <!-- right side -->
      <div class="right-column"></div>
    </div>

    <!-- Script de validação -->
    <script>
      const pass1 = document.getElementById("password1");
      const pass2 = document.getElementById("password2");
      const criar = document.getElementById("criar");
      const error = document.getElementById("error");

      document.getElementById("password2").addEventListener("input", validar);

      function validar() {
        if (pass2.value === "") {
          criar.disabled = false;
          error.style.display = "none";
          return;
        }

        if (pass1.value !== pass2.value) {
          criar.disabled = true;
          error.style.display = "block";
        } else {
          criar.disabled = false;
          error.style.display = "none";
        }
      }

      function mostrar() {
        const type = pass1.type === "password" ? "text" : "password";
        pass1.type = type;
        pass2.type = type;
      }
    </script>

    <!-- Script Firebase -->
    <script type="module" src="./script/criarConta.mjs"></script>
  </body>
</html>
