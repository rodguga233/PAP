<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <linkhref="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="template/css/main.css" />
    <link rel="stylesheet" href="template/css/entry-page.css" />
  </head>

  <body>
    <script type="module" src="./auntentica.mjs"></script>

    <div class="row height-full">
      <!-- left side -->
      <div
        class="left-column flex flex-column height-full justify-center items-center"
      >
        <h1 class="welcoming-title">Bem-vindo de volta</h1>

        <form id="Login" class="form" autocomplete="off">
          <label for="email" class="label">Email</label>
          <input type="email" name="email" id="email" class="input" required />

          <label for="password" class="label">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="input"
            required
          />

          <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 10px; font-size: 15px; width: auto;">
            <input type="checkbox" onclick="mostrar()" style="width: 20px; height: 20px; transform: scale(0.9); cursor: pointer;" />
            <span class="label-text">Mostrar Password</span>
          </label>


          <button
            type="submit"
            class="button regular-button pink-background cta-btn"
          >
            Entrar
          </button>
        </form>

        <p class="sign-up-prompt">
          Ainda não tens conta?
          <a href="./criarConta.html" class="sign-up-link">Criar Conta</a>
        </p>
      </div>

      <!-- right side -->
      <div class="right-column"></div>
    </div>

    <script>
      function mostrar() {
        const x = document.getElementById("password");
        x.type = x.type === "password" ? "text" : "password";
      }
    </script>
  </body>
</html>
